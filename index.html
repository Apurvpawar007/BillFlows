<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241C14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>The Fried Cafe POS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍟</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">FC</span>
      <span class="brand-text">The Fried Cafe <em>POS</em></span>
    </div>
    <button class="btn btn-primary btn-new-order" data-nav="neworder">+ New Order</button>
  </header>

  <!-- Nav -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-nav="dashboard"><span class="tab-icon">🏠</span><span class="tab-label">Dashboard</span></button>
    <button class="tab" data-nav="neworder"><span class="tab-icon">➕</span><span class="tab-label">New Order</span></button>
    <button class="tab" data-nav="orders"><span class="tab-icon">📋</span><span class="tab-label">Orders</span></button>
    <button class="tab" data-nav="unpaid"><span class="tab-icon">💳</span><span class="tab-label">Unpaid</span> <span class="tab-badge" id="unpaid-badge" hidden>0</span></button>
    <button class="tab" data-nav="menu"><span class="tab-icon">🍽️</span><span class="tab-label">Menu</span></button>
    <button class="tab" data-nav="sales"><span class="tab-icon">📊</span><span class="tab-label">Sales</span></button>
    <button class="tab" data-nav="expenses"><span class="tab-icon">💰</span><span class="tab-label">Expenses</span></button>
    <button class="tab" data-nav="settings"><span class="tab-icon">⚙️</span><span class="tab-label">Settings</span></button>
    <button class="tab" id="tab-more"><span class="tab-icon">☰</span><span class="tab-label">More</span></button>
  </nav>

  <main id="view-root" class="view-root"></main>
</div>

<!-- Mobile "More" sheet -->
<div class="mobile-more-overlay" id="mobile-more-overlay">
  <div class="mobile-more-sheet">
    <div class="sheet-handle"></div>
    <button data-nav="menu"><span class="sheet-icon">🍽️</span> Menu Management</button>
    <button data-nav="sales"><span class="sheet-icon">📊</span> Sales & Profit</button>
    <button data-nav="expenses"><span class="sheet-icon">💰</span> Expenses</button>
    <button data-nav="settings"><span class="sheet-icon">⚙️</span> Settings</button>
  </div>
</div>

<!-- Modal root -->
<div id="modal-root"></div>

<script src="app.js"></script>
</body>
</html>
